[project]
name = "Pac-Man"
version = "0.1.0"
description = "Pac-Man game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mazegenerator",
    "pygame>=2.6.1",
]

[tool.uv.sources]
mazegenerator = { path = "vendor/mazegenerator-2.0.2-py3-none-any.whl" }

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pyinstaller>=6.22.3",
]

[tool.ruff]
line-length = 79

[[tool.mypy.overrides]]
module = "mazegenerator.*"
ignore_missing_imports = true
